<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign Spotters</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #dff3e4; --ink: #1d3557; --card: #ffffff;
  --accent: #ff6b6b; --accent-dark: #c94444; --ok: #06d6a0;
  --slot: #eef7f0; --slot-edge: #2a9d8f; --hl: #ffd23f;
  --sign: clamp(76px, min(24vw, 17vh), 130px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; }
h1 { margin: 0; font-size: clamp(1.2rem, 4vw, 1.7rem); font-weight: 700; }
.head-right { display: flex; gap: 8px; align-items: center; }
.head-left { display: flex; gap: 10px; align-items: center; flex: 1; min-width: 0; }
.head-left h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#stars { white-space: nowrap; }
@media (max-width: 360px) {
  header { padding: 8px 10px; gap: 6px; }
  .head-left { gap: 6px; }
  .home { width: 44px; height: 44px; font-size: 1.3rem; }
  .head-left h1 { font-size: 1.1rem; }
}
.home {
  width: 48px; height: 48px; flex: none; border-radius: 50%; display: grid; place-items: center;
  background: #fff; font-size: 1.5rem; text-decoration: none; box-shadow: 0 4px 0 rgba(29, 53, 87, 0.15);
}
.home:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
.home:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(29, 53, 87, 0.15); }
#stars {
  background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 1.05rem; font-weight: 600;
  box-shadow: 0 4px 0 rgba(29, 53, 87, 0.15);
}
#stars.pop { animation: pop 0.5s cubic-bezier(.2, 1.6, .4, 1); }
.chip {
  font-family: inherit; font-size: 1.05rem; font-weight: 600; min-width: 48px; min-height: 44px; padding: 6px 12px;
  border: none; border-radius: 999px; background: var(--slot); color: var(--ink); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
button:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }

main {
  flex: 1; min-height: 0; width: 100%; max-width: 560px;
  padding: 0 56px 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(6px, 1.4vh, 14px);
}
#setup {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 8;
  width: min(94vw, 480px); display: none; flex-wrap: wrap; gap: 12px 20px; justify-content: center;
  background: #fff; border-radius: 24px; padding: 12px 16px; box-shadow: 0 6px 0 rgba(29, 53, 87, 0.12);
}
#setup.open { display: flex; }
.opt { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
.opt > span { font-weight: 600; }
.voice-select {
  font-family: inherit; font-size: 1rem; font-weight: 600; padding: 8px 12px; max-width: 240px;
  border-radius: 999px; border: none; background: var(--slot); color: var(--ink); min-height: 44px;
}
#progress { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; min-height: 18px; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px var(--slot-edge); }
.dot.on { background: var(--ok); box-shadow: none; }
.dot.cur { outline: 3px solid var(--ink); outline-offset: 2px; }
#prompt {
  min-height: clamp(44px, 8vh, 70px); display: flex; align-items: center; justify-content: center; gap: 0.3em;
  background: #fff; border-radius: 24px; padding: 8px 18px; text-align: center;
  font-size: clamp(1.2rem, min(5vw, 4.2vh), 2rem); font-weight: 700;
  box-shadow: 0 6px 0 rgba(29, 53, 87, 0.12);
}

/* Road trip: a side view of a road, a sign or light by the road, a car that waits for the child. */
#stage { width: 100%; display: flex; justify-content: center; }
#stage:empty { display: none; }
#road {
  position: relative; width: min(100%, 440px); height: clamp(130px, 26vh, 200px); border-radius: 28px; overflow: hidden;
  background: linear-gradient(#bde0fe 0 58%, #8ac926 58% 64%, #6c757d 64% 100%);
  box-shadow: 0 8px 0 rgba(29, 53, 87, 0.15);
}
#road::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 17%; height: 5px;
  background: repeating-linear-gradient(90deg, #fff 0 26px, transparent 26px 50px);
}
.roadside { position: absolute; right: 6%; bottom: 36%; width: 24%; display: flex; flex-direction: column; align-items: center; }
.roadside svg { width: 100%; height: auto; display: block; }
.roadside .pole { width: 7%; min-width: 5px; height: clamp(14px, 4vh, 30px); background: #8d99ae; }
#car { position: absolute; bottom: 4%; left: 34%; width: 30%; transition: left 1.6s ease-in; }
#car svg { width: 100%; height: auto; display: block; }
#car.enter { animation: drivein 1.2s ease-out both; }
#car.gone { left: 115%; }
#car.slow { left: 115%; transition: left 4.5s linear; }
#car .brake { fill: #7a1b1b; }
#car.stopped .brake { fill: #ff2d2d; filter: drop-shadow(0 0 4px #ff2d2d); }
#walker {
  position: absolute; left: 66%; bottom: 36%; font-size: clamp(1.6rem, 6vh, 2.6rem); line-height: 1;
  transition: bottom 2.4s ease-in-out 0.6s;
}
#walker.cross { bottom: 0; }

#msg { min-height: 1.5em; font-size: clamp(1rem, 3.5vw, 1.35rem); font-weight: 600; text-align: center; }
#choices { display: flex; gap: clamp(8px, 2vw, 16px); flex-wrap: wrap; justify-content: center; }
.choice {
  border: none; border-radius: 26px; background: #fff; cursor: pointer; padding: 8px;
  box-shadow: 0 6px 0 rgba(29, 53, 87, 0.2); transition: transform 0.12s;
  color: var(--ink); font-family: inherit; font-weight: 700;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.choice.sign { width: calc(var(--sign) + 16px); height: calc(var(--sign) + 16px); }
.choice.sign svg { width: var(--sign); height: var(--sign); display: block; }
.choice.act { min-width: clamp(80px, 22vw, 116px); min-height: clamp(72px, 12vh, 104px); font-size: clamp(0.95rem, 3.6vw, 1.15rem); }
.choice.act .emo { font-size: clamp(1.9rem, 8vw, 2.8rem); line-height: 1; }
.choice:hover { transform: translateY(-3px); }
.choice:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(29, 53, 87, 0.2); }
.choice.wobble { animation: wobble 0.45s; }
.choice.hint { animation: pulse 0.8s ease-in-out infinite; outline: 5px solid var(--hl); }
.choice.done { background: var(--ok); }
.choice.done.grow { animation: grow 0.7s cubic-bezier(.2, 1.4, .4, 1) both; }
#finish { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-weight: 600; font-size: clamp(1rem, 3.6vw, 1.3rem); }
#finish .emo { font-size: clamp(70px, min(26vw, 16vh), 140px); line-height: 1; }
.buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn {
  font-family: inherit; font-size: 1.1rem; font-weight: 600; border: none; border-radius: 999px;
  padding: 10px 16px; min-height: 44px; background: #fff; color: var(--ink);
  box-shadow: 0 5px 0 rgba(29, 53, 87, 0.2); cursor: pointer;
}
.btn:disabled { opacity: 0.4; cursor: default; }
.arrow {
  position: fixed; top: 50%; transform: translateY(-50%); z-index: 5;
  width: 52px; height: 52px; border-radius: 50%; border: none;
  display: grid; place-items: center; background: #fff; color: var(--ink); font-size: 1.5rem;
  box-shadow: 0 5px 0 rgba(29, 53, 87, 0.2); cursor: pointer;
}
#back { left: 4px; }
#next { right: 4px; }
.arrow.primary { background: var(--accent); color: #fff; box-shadow: 0 5px 0 var(--accent-dark); }
.arrow:disabled { opacity: 0.3; cursor: default; box-shadow: none; }
/* Narrow phones: the road and three signs need the full width, so the arrows move to the bottom corners. */
@media (max-width: 399px) {
  main { padding: 0 10px 64px; justify-content: safe center; }
  :root { --sign: clamp(64px, calc((100vw - 90px) / 3), 100px); }
  .arrow { top: auto; bottom: 6px; transform: none; }
  .buttons { position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%); z-index: 5; flex-wrap: nowrap; }
  .buttons .btn { min-width: 52px; min-height: 52px; padding: 6px 12px; font-size: 1.4rem; }
  .buttons .lbl { display: none; }
  .choice.act { min-width: 0; width: calc((100vw - 60px) / 3); }
}
canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

@keyframes pop { 0% { transform: scale(0.6); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes grow { from { transform: scale(0.4); } to { transform: scale(1.12); } }
@keyframes wobble { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px) rotate(-4deg); } 75% { transform: translateX(8px) rotate(4deg); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
@keyframes drivein { from { left: -32%; } to { left: 34%; } }
/* Reduced motion: no animation; the car and Teddy jump straight to where they end up. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header>
  <div class="head-left">
    <a class="home" href="../../index.html" aria-label="Home">🏠</a>
    <h1>Sign Spotters</h1>
  </div>
  <div class="head-right">
    <div id="stars" aria-label="Stars">⭐ 0</div>
    <button class="chip" id="settingsBtn" aria-expanded="false" aria-label="Settings">⚙️</button>
  </div>
</header>

<div id="setup" aria-label="Settings">
  <div class="opt">
    <span>Game</span>
    <button class="chip" data-group="mode" data-val="find" aria-pressed="false">Find the sign</button>
    <button class="chip" data-group="mode" data-val="trip" aria-pressed="false">Road trip</button>
    <button class="chip" data-group="mode" data-val="both" aria-pressed="true">Both</button>
  </div>
  <div class="opt">
    <span>Questions per round</span>
    <button class="chip" data-group="round" data-val="3" aria-pressed="false">3</button>
    <button class="chip" data-group="round" data-val="5" aria-pressed="true">5</button>
    <button class="chip" data-group="round" data-val="10" aria-pressed="false">10</button>
  </div>
  <div class="opt">
    <span>Voice</span>
    <select id="voice" class="voice-select" aria-label="Voice">
      <option value="girl">Girl voice (built in)</option>
      <option value="boy">Boy voice (built in)</option>
    </select>
  </div>
</div>

<main>
  <div id="progress" aria-label="Round progress"></div>
  <div id="prompt" aria-live="polite"></div>
  <div id="stage"></div>
  <div id="msg" aria-live="polite"></div>
  <div id="choices" aria-label="Choices"></div>
  <div class="buttons">
    <button class="btn" id="sayBtn" aria-label="Say it">🔊<span class="lbl"> Say it</span></button>
    <button class="btn" id="hintBtn" aria-label="Help me">💡<span class="lbl"> Help me</span></button>
  </div>
</main>

<button class="arrow" id="back" aria-label="Previous question">◀</button>
<button class="arrow primary" id="next" aria-label="Next question">▶</button>
<canvas id="confetti"></canvas>

<script>
/* ---------- content ---------- */
// Safety first: only signs that mean the same for a child on foot in most countries, and every line
// about crossing says "with a grown-up" and "look and listen" (tests/sign-spotters/content.spec.js checks).
// Shape names (clip shape-<k>), the same words Shape Friends uses.
const SHAPES = ["octagon", "triangle", "circle", "square", "rectangle"];
// What a sign tells you (clip mean-<k> says `line`). stop/slow/go are also the Road trip buttons.
const MEANINGS = [
  { k: "stop", say: "Stop", e: "🛑", line: "Stop!" },
  { k: "slow", say: "Slow down", e: "🐢", line: "Slow down!" },
  { k: "go", say: "Go", e: "✅", line: "Go!" },
  { k: "careful", say: "Careful", e: "⚠️", line: "Be careful!" },
  { k: "no-way", say: "No way in", e: "⛔", line: "No way in!" },
  { k: "wait", say: "Wait", e: "✋", line: "Wait and let others go first!" },
  { k: "lights", say: "Watch the lights", e: "🚦", line: "Red means stop. Green means go!" },
  { k: "walk", say: "Walk", e: "🚶", line: "Walk across with a grown-up. Look and listen first!" },
  { k: "cross-here", say: "Cross here", e: "🚸", line: "A place to cross, with a grown-up. Look and listen first!" },
];
// The signs (clip sign-<k> says `say`). shape: a SHAPES key; color: the main colour, for hints;
// means: a MEANINGS key. The picture for each is SIGN_ART[k].
const SIGNS = [
  { k: "stop", say: "stop sign", shape: "octagon", color: "red", means: "stop" },
  { k: "traffic-light", say: "traffic light", shape: "rectangle", color: "black", means: "lights" },
  { k: "walk", say: "walk sign", shape: "square", color: "green", means: "walk" },
  { k: "crossing", say: "crossing sign", shape: "square", color: "blue", means: "cross-here" },
  { k: "school", say: "school sign", shape: "triangle", color: "red", means: "careful" },
  { k: "road-works", say: "road works sign", shape: "triangle", color: "red", means: "careful" },
  { k: "give-way", say: "give way sign", shape: "triangle", color: "red", means: "wait" },
  { k: "no-entry", say: "no entry sign", shape: "circle", color: "red", means: "no-way" },
];
// Traffic lights in Road trip (clip light-<k> says `say`).
const LIGHTS = [
  { k: "red", say: "Red light" },
  { k: "yellow", say: "Yellow light" },
  { k: "green", say: "Green light" },
];
// Road trip: what the car meets and what it should do (act: stop | slow | go).
// teddy: Teddy and a grown-up cross while the car waits.
const TRIP = [
  { light: "red", act: "stop" },
  { light: "yellow", act: "slow" },
  { light: "green", act: "go" },
  { sign: "stop", act: "stop" },
  { sign: "no-entry", act: "stop" },
  { sign: "walk", act: "stop", teddy: true },
  { sign: "school", act: "slow" },
  { sign: "road-works", act: "slow" },
  { sign: "give-way", act: "slow" },
  { sign: "crossing", act: "slow" },
];
const ACTIONS = ["stop", "slow", "go"]; // the Road trip buttons, always in this order
const PRAISE = ["Amazing!", "You did it!", "Super spotting!", "Wow, you're a star!", "Hooray!"];
// Spoken text for the device voices (the clip files use the same words)
const PHRASES = {
  "find-the": "Find the", "what-do": "What does the car do?", "look-again": "Let's look again!",
  "its-a": "It's a", "its-an": "It's an", "teddy-cross": "Teddy crosses with a grown-up. Look and listen!",
};
const DEVICE_PHRASES = { "great": "Great spotting! Can you find a stop sign outside, with a grown-up?" };
// The girl/boy clips (audio/, audio-m/) are not recorded yet. Until they are, the built-in voices
// speak the same text with the device voice. Set to true once every clip exists in both voices
// (tests/sign-spotters/content.spec.js fails if this is out of date either way).
let CLIPS_RECORDED = false;
const TILE_COLORS = ["#ffd23f", "#ff9f1c", "#4cc9f0", "#06d6a0", "#b388ff", "#ff8fab"];
const CHOICES = 3; // signs offered in "Find the sign"

/* ---------- pictures (inline SVG, 100×100) ---------- */
const RED = "#d62828", WHITE = "#ffffff", DARK = "#263238";
function octagon(r) {
  return Array.from({ length: 8 }, (_, i) => {
    const a = (Math.PI / 8) * (2 * i - 1) - Math.PI / 2;
    return `${(50 + r * Math.cos(a)).toFixed(1)},${(50 + r * Math.sin(a)).toFixed(1)}`;
  }).join(" ");
}
// A walking person in a 40×60 box, placed with translate/scale.
function walker(x, y, s, col) {
  return `<g transform="translate(${x} ${y}) scale(${s})"><circle cx="20" cy="8" r="6.5" fill="${col}"/>` +
    `<path d="M20 16 L17 36 M19 21 L8 31 M19 21 L31 28 M17 36 L7 56 M17 36 L29 56" stroke="${col}" stroke-width="5.5" ` +
    `stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>`;
}
function warning(inner) {
  return `<polygon points="50,5 97,91 3,91" fill="${RED}" stroke-linejoin="round"/>` +
    `<polygon points="50,23 82,82 18,82" fill="${WHITE}"/>` + inner;
}
// on: which light is lit ("red" | "yellow" | "green"); none = all three (the sign in Find the sign).
function lightArt(on) {
  const lamp = (cy, k, col) => `<circle cx="50" cy="${cy}" r="12" fill="${col}" opacity="${!on || on === k ? 1 : 0.22}"/>`;
  return `<rect x="28" y="3" width="44" height="94" rx="12" fill="${DARK}"/>` +
    lamp(21, "red", "#ff3b30") + lamp(50, "yellow", "#ffcc00") + lamp(79, "green", "#34c759");
}
const SIGN_ART = {
  "stop": () => `<polygon points="${octagon(48)}" fill="${WHITE}"/><polygon points="${octagon(43)}" fill="${RED}"/>` +
    `<text x="50" y="59" text-anchor="middle" font-size="25" font-weight="700" fill="${WHITE}" font-family="Arial, Helvetica, sans-serif">STOP</text>`,
  "traffic-light": () => lightArt(null),
  "walk": () => `<rect x="6" y="6" width="88" height="88" rx="12" fill="${DARK}"/>` + walker(28, 15, 1.2, "#3ddc84"),
  "crossing": () => `<rect x="5" y="5" width="90" height="90" rx="12" fill="#1d6fd1" stroke="${WHITE}" stroke-width="4"/>` +
    `<polygon points="50,14 88,82 12,82" fill="${WHITE}"/>` + walker(39, 34, 0.55, "#111") +
    [28, 40, 52, 64].map(x => `<rect x="${x}" y="70" width="7" height="8" fill="#111"/>`).join(""),
  "school": () => warning(walker(29, 44, 0.55, "#111") + walker(49, 49, 0.46, "#111")),
  "road-works": () => warning(walker(33, 42, 0.55, "#111") +
    `<path d="M52 79 Q63 62 75 79 Z" fill="#111"/><path d="M47 58 L62 74" stroke="#111" stroke-width="4" stroke-linecap="round"/>`),
  "give-way": () => `<polygon points="3,9 97,9 50,95" fill="${RED}" stroke-linejoin="round"/><polygon points="20,18 80,18 50,73" fill="${WHITE}"/>`,
  "no-entry": () => `<circle cx="50" cy="50" r="47" fill="${RED}"/><rect x="17" y="41" width="66" height="18" rx="3" fill="${WHITE}"/>`,
};
function svg(inner) { return `<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">${inner}</svg>`; }
function signSVG(k) { return svg(SIGN_ART[k]()); }
const CAR_SVG = `<svg viewBox="0 0 120 60" aria-hidden="true" focusable="false">` +
  `<path d="M28 27 L40 9 H80 L97 27 Z" fill="#ff6b6b"/><rect x="4" y="24" width="112" height="22" rx="10" fill="#ff6b6b"/>` +
  `<path d="M39 26 L47 14 H59 V26 Z M64 14 H78 L88 26 H64 Z" fill="#bde0fe"/>` +
  `<rect class="brake" x="2" y="28" width="7" height="8" rx="2"/><rect x="111" y="28" width="7" height="7" rx="2" fill="#ffd23f"/>` +
  `<circle cx="30" cy="46" r="10" fill="#1d3557"/><circle cx="90" cy="46" r="10" fill="#1d3557"/>` +
  `<circle cx="30" cy="46" r="4" fill="#ccc"/><circle cx="90" cy="46" r="4" fill="#ccc"/></svg>`;

/* ---------- state ---------- */
const $ = id => document.getElementById(id);
let mode = "both", roundSize = 5;
let deck = [];       // questions in this round: { type: "find", sign, choices: [signs] } | { type: "trip", ev }
let states = [];     // per question: { solved, tries }
let index = 0;       // deck.length means the finish screen
let hintTimer = null;
let seq = 0;         // changes whenever audio is stopped, so old callbacks do nothing
let playing = null;

/* ---------- helpers ---------- */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function solvedCount() { return states.filter(s => s.solved).length; }
function article(word) { return /^[aeiou]/i.test(word) ? "an" : "a"; }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function signOf(k) { return SIGNS.find(s => s.k === k); }
function meaningOf(k) { return MEANINGS.find(m => m.k === k); }
function lightOf(k) { return LIGHTS.find(l => l.k === k); }
// The name of what the car meets: "Stop sign" / "Red light"
function eventName(ev) { return ev.light ? lightOf(ev.light).say : cap(signOf(ev.sign).say); }
function eventClip(ev) { return ev.light ? `light-${ev.light}` : `sign-${ev.sign}`; }

// "Find the sign": the target and two signs of other shapes (so "look for the octagon" always helps).
function findQuestion(sign) {
  const others = shuffle(SIGNS.filter(s => s.shape !== sign.shape)).slice(0, CHOICES - 1);
  return { type: "find", sign, choices: shuffle([sign, ...others]) };
}
// A round: question types by mode; signs and trip events come from shuffled bags so they don't
// repeat until all have been used. Each Road trip starts with a traffic light.
function makeDeck(size) {
  const types = Array.from({ length: size }, () => mode === "both" ? (Math.random() < 0.5 ? "find" : "trip") : mode);
  let signBag = [], tripBag = [], firstTrip = true;
  return types.map(type => {
    if (type === "find") {
      if (!signBag.length) signBag = shuffle(SIGNS.slice());
      return findQuestion(signBag.pop());
    }
    if (firstTrip) {
      firstTrip = false;
      const lights = shuffle(TRIP.filter(e => e.light));
      tripBag = shuffle(TRIP.filter(e => e !== lights[0]));
      return { type: "trip", ev: lights[0] };
    }
    if (!tripBag.length) tripBag = shuffle(TRIP.slice());
    return { type: "trip", ev: tripBag.pop() };
  });
}
function freshState() { return { solved: false, tries: 0 }; }
function answerOf(q) { return q.type === "find" ? q.sign.k : q.ev.act; }

/* ---------- audio ---------- */
function stopAudio() {
  seq++;
  if (playing) { try { playing.pause(); } catch (e) {} playing = null; }
  try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (e) {}
}
function clipText(name) {
  let m;
  if ((m = name.match(/^sign-(.+)$/))) { const s = signOf(m[1]); return s ? s.say : ""; }
  if ((m = name.match(/^mean-(.+)$/))) { const x = meaningOf(m[1]); return x ? x.line : ""; }
  if ((m = name.match(/^light-(.+)$/))) { const l = lightOf(m[1]); return l ? l.say : ""; }
  if ((m = name.match(/^shape-(.+)$/))) return SHAPES.includes(m[1]) ? m[1] : "";
  if (name.startsWith("p-")) return PRAISE[Number(name.slice(2))] || "";
  return PHRASES[name] || DEVICE_PHRASES[name] || "";
}
function speakDevice(text, voiceName, done, pitch = 1.2) {
  let fired = false;
  const fin = () => { if (!fired) { fired = true; setTimeout(done, 300); } };
  try {
    if (!("speechSynthesis" in window) || !text) return fin();
    const u = new SpeechSynthesisUtterance(text);
    const v = voiceName && speechSynthesis.getVoices().find(x => x.name === voiceName);
    if (v) u.voice = v;
    u.rate = 0.85; u.pitch = pitch;
    u.onend = fin; u.onerror = fin;
    window.__utter = u;
    speechSynthesis.resume();
    speechSynthesis.speak(u);
    setTimeout(fin, 5000);
  } catch (e) { fin(); }
}
// Play one clip with the chosen voice, then call done exactly once.
// Built-in voices without recorded clips (or a clip that fails to play) use the device voice.
function playOne(name, done) {
  let fired = false;
  const d = () => { if (!fired) { fired = true; done(); } };
  const voice = $("voice").value;
  if (voice.startsWith("dev:")) { speakDevice(clipText(name), voice.slice(4), d); return; }
  const pitch = voice === "boy" ? 0.95 : 1.25;
  if (!CLIPS_RECORDED) { speakDevice(clipText(name), null, d, pitch); return; }
  const token = seq;
  let fell = false;
  const fallback = () => {
    if (fell || fired) return;
    fell = true;
    if (token === seq) speakDevice(clipText(name), null, d, pitch); else d();
  };
  const a = new Audio((voice === "boy" ? "audio-m/" : "audio/") + name + ".wav");
  playing = a;
  a.onended = d;
  a.onerror = fallback;
  const p = a.play();
  if (p && typeof p.catch === "function") p.catch(fallback);
}
function playSequence(names) {
  stopAudio();
  const token = seq;
  let i = 0;
  const next = () => {
    if (token !== seq || i >= names.length) return;
    playOne(names[i++], next);
  };
  next();
}
// "Find the stop sign" / "Red light. What does the car do?"
function promptClips(q) {
  if (q.type === "find") return ["find-the", `sign-${q.sign.k}`];
  return [eventClip(q.ev), "what-do"];
}
// "Stop sign. It's an octagon. Stop!" / "Walk sign. Stop! Teddy crosses with a grown-up…"
function answerClips(q) {
  if (q.type === "find") {
    const s = q.sign;
    return [`sign-${s.k}`, article(s.shape) === "an" ? "its-an" : "its-a", `shape-${s.shape}`, `mean-${s.means}`];
  }
  return [eventClip(q.ev), `mean-${q.ev.act}`, ...(q.ev.teddy ? ["teddy-cross"] : [])];
}
function answerText(q) {
  if (q.type === "find") {
    const s = q.sign;
    return `It's ${article(s.shape)} ${s.shape}. ${meaningOf(s.means).line}`;
  }
  return meaningOf(q.ev.act).line + (q.ev.teddy ? " " + PHRASES["teddy-cross"] : "");
}
function promptText(q, st) {
  if (q.type === "find") return st.solved ? `${cap(q.sign.say)}!` : `Find the ${q.sign.say}!`;
  return st.solved ? `${eventName(q.ev)}! ${meaningOf(q.ev.act).line}` : `${eventName(q.ev)}! What does the car do?`;
}

/* ---------- game flow ---------- */
function newGame() {
  stopAudio();
  deck = makeDeck(roundSize);
  states = deck.map(freshState);
  index = 0;
  renderQuestion();
  sayPrompt();
}
function sayPrompt() {
  if (index >= deck.length) return;
  const q = deck[index];
  playSequence(states[index].solved ? answerClips(q) : promptClips(q));
}
function renderDots() {
  const box = $("progress");
  box.innerHTML = "";
  deck.forEach((_, i) => {
    const d = document.createElement("span");
    d.className = "dot" + (states[i] && states[i].solved ? " on" : "") + (i === index ? " cur" : "");
    box.appendChild(d);
  });
  box.setAttribute("aria-label", `Question ${Math.min(index + 1, deck.length)} of ${deck.length}`);
}
// Where the car ends up after the right answer.
function carEnd(ev) { return ev.act === "stop" ? "stopped" : ev.act === "slow" ? "slow" : "gone"; }
function renderStage() {
  const q = deck[index], st = states[index];
  const stage = $("stage");
  stage.innerHTML = "";
  if (q.type !== "trip") return;
  const ev = q.ev;
  const art = ev.light ? svg(lightArt(ev.light)) : signSVG(ev.sign);
  const label = ev.light ? lightOf(ev.light).say : signOf(ev.sign).say;
  stage.innerHTML =
    `<div id="road" role="img" aria-label="A car on the road and a ${label.toLowerCase()}">` +
    `<div class="roadside">${art}<div class="pole"></div></div>` +
    (ev.teddy ? `<span id="walker" class="${st.solved ? "cross" : ""}" aria-hidden="true">🧑🧸</span>` : "") +
    `<div id="car" class="${st.solved ? carEnd(ev) : "enter"}">${CAR_SVG}</div></div>`;
}
function renderQuestion() {
  if (index >= deck.length) { renderFinish(); return; }
  const q = deck[index];
  const st = states[index];

  renderDots();
  $("stars").textContent = "⭐ " + solvedCount();
  $("prompt").textContent = promptText(q, st);
  renderStage();

  const box = $("choices");
  box.innerHTML = "";
  const answer = answerOf(q);
  if (q.type === "find") {
    q.choices.forEach(s => {
      const b = document.createElement("button");
      b.className = "choice sign" + (st.solved && s.k === answer ? " done" : "");
      b.dataset.value = s.k;
      b.setAttribute("aria-label", s.say);
      b.innerHTML = signSVG(s.k);
      box.appendChild(b);
    });
  } else {
    ACTIONS.forEach(k => {
      const m = meaningOf(k);
      const b = document.createElement("button");
      b.className = "choice act" + (st.solved && k === answer ? " done" : "");
      b.dataset.value = k;
      b.setAttribute("aria-label", m.say);
      b.innerHTML = `<span class="emo" aria-hidden="true">${m.e}</span><span aria-hidden="true">${m.say}</span>`;
      box.appendChild(b);
    });
  }

  if (st.solved) $("msg").textContent = answerText(q);
  else $("msg").textContent = q.type === "find" ? "Tap the sign!" : "Tap what the car should do!";
  setNav();
  resetHint();
}
function renderFinish() {
  const n = solvedCount();
  $("progress").innerHTML = "";
  $("progress").setAttribute("aria-label", "All done");
  $("stars").textContent = "⭐ " + n;
  $("prompt").textContent = "All done!";
  $("stage").innerHTML = '<div id="finish"><span class="emo" role="img" aria-label="Trophy">🏆</span>' +
    "<span>Can you find a stop sign outside, with a grown-up? 🛑</span></div>";
  $("choices").innerHTML = "";
  $("msg").textContent = n ? `You got ${n} of ${deck.length} right! ${"⭐".repeat(n)}` : "Let's play again! 🔁";
  clearTimeout(hintTimer);
  setNav();
}
function setNav() {
  const finished = index >= deck.length;
  $("back").disabled = index === 0;
  $("next").textContent = finished ? "🔁" : (index === deck.length - 1 ? "🏆" : "▶");
  $("next").setAttribute("aria-label", finished ? "Play again" : (index === deck.length - 1 ? "Finish" : "Next question"));
  $("sayBtn").disabled = finished;
  $("hintBtn").disabled = finished;
}
function goNext() {
  if (index >= deck.length) { newGame(); return; }
  index++;
  renderQuestion();
  if (index < deck.length) sayPrompt();
  else playSequence(["great"]);
}
function goBack() {
  if (index === 0) return;
  index = Math.min(index, deck.length) - 1;
  renderQuestion();
  sayPrompt();
}
function wobble(el) {
  if (!el) return;
  el.classList.remove("wobble");
  void el.offsetWidth;
  el.classList.add("wobble");
}

/* ---------- answering ---------- */
function choose(value, btn) {
  if (index >= deck.length) return;
  const st = states[index];
  const q = deck[index];
  if (st.solved) return;
  if (value !== answerOf(q)) {
    st.tries++;
    wobble(btn);
    beep(220, 0.15, "sine");
    $("msg").textContent = "Let's look again!";
    playSequence(["look-again", ...promptClips(q)]);
    resetHint();
    return;
  }
  celebrate();
}

/* ---------- success ---------- */
function celebrate() {
  states[index].solved = true;
  clearTimeout(hintTimer);
  const q = deck[index];
  renderQuestion();
  if (q.type === "trip") {
    // Draw the car where it waited, then move it, so it visibly stops, slows or drives on.
    const car = $("car"), walker = $("walker");
    car.className = "";
    if (walker) walker.className = "";
    void car.offsetWidth;
    car.className = carEnd(q.ev);
    if (walker) walker.className = "cross";
  }
  const stars = $("stars");
  stars.classList.remove("pop");
  void stars.offsetWidth;
  stars.classList.add("pop");
  const done = $("choices").querySelector(".done");
  if (done) { done.classList.add("grow"); done.focus(); }
  const pi = Math.floor(Math.random() * PRAISE.length);
  $("msg").textContent = `${PRAISE[pi]} ${answerText(q)}`;
  playSequence([`p-${pi}`, ...answerClips(q)]);
  fanfare();
  burst();
}

/* ---------- help ---------- */
function resetHint() {
  clearTimeout(hintTimer);
  document.querySelectorAll(".hint").forEach(t => t.classList.remove("hint"));
  if (index < deck.length && !states[index].solved) {
    hintTimer = setTimeout(autoHint, 10000);
  }
}
function autoHint() {
  if (index >= deck.length || states[index].solved) return;
  if ($("setup").classList.contains("open") || document.hidden) { hintTimer = setTimeout(autoHint, 10000); return; }
  showHint();
}
function showHint() {
  if (index >= deck.length) return;
  const st = states[index];
  if (st.solved) {
    $("msg").textContent = "You already got this one! 🎉";
    return;
  }
  const q = deck[index];
  document.querySelectorAll(".hint").forEach(t => t.classList.remove("hint"));
  const right = $("choices").querySelector(`.choice[data-value="${answerOf(q)}"]`);
  if (right) right.classList.add("hint");
  $("msg").textContent = q.type === "find" ? `Look for the ${q.sign.shape}!` : "Look at the sign!";
  playSequence(promptClips(q));
}

/* ---------- sound effects and confetti ---------- */
let ac = null;
function audio() {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
  } catch (e) { ac = null; }
  return ac;
}
function beep(freq, dur = 0.2, type = "triangle", when = 0) {
  const a = audio();
  if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain();
    const t = a.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
function fanfare() { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.3, "triangle", i * 0.13)); }

const cv = $("confetti");
const cx = cv.getContext ? cv.getContext("2d") : null;
let parts = [], running = false;
function sizeCanvas() { cv.width = innerWidth; cv.height = innerHeight; }
sizeCanvas();
addEventListener("resize", sizeCanvas);
function burst() {
  if (!cx || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let i = 0; i < 140; i++) {
    parts.push({
      x: innerWidth / 2 + (Math.random() - 0.5) * 120, y: innerHeight * 0.35,
      vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 16 - 4,
      s: Math.random() * 8 + 6, c: TILE_COLORS[i % TILE_COLORS.length],
      r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, life: 0
    });
  }
  if (!running) { running = true; requestAnimationFrame(tick); }
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => {
    p.vy += 0.35; p.vx *= 0.99;
    p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    cx.save();
    cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.fillStyle = p.c;
    cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    cx.restore();
  });
  parts = parts.filter(p => p.y < cv.height + 20 && p.life < 300);
  if (parts.length) requestAnimationFrame(tick); else running = false;
}

/* ---------- voices ---------- */
function fillVoices() {
  const sel = $("voice");
  if (!("speechSynthesis" in window)) return;
  const prev = sel.value;
  const keep = [...sel.querySelectorAll("option")].filter(o => !o.value.startsWith("dev:"));
  sel.innerHTML = "";
  keep.forEach(o => sel.appendChild(o));
  speechSynthesis.getVoices()
    .filter(v => /^en/i.test(v.lang))
    .forEach(v => {
      const o = document.createElement("option");
      o.value = "dev:" + v.name;
      o.textContent = "Device: " + v.name;
      sel.appendChild(o);
    });
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
}

/* ---------- settings panel ---------- */
function setSettings(open) {
  $("setup").classList.toggle("open", open);
  $("settingsBtn").setAttribute("aria-expanded", String(open));
}

/* ---------- wiring ---------- */
$("choices").addEventListener("click", e => {
  const c = e.target.closest(".choice");
  if (c) { audio(); choose(c.dataset.value, c); }
});
// Up/Down move between the answers (Enter/Space taps, as on any button).
function moveFocus(step) {
  const items = [...document.querySelectorAll("#choices button")];
  if (!items.length) return;
  const at = items.indexOf(document.activeElement);
  const to = at < 0 ? (step > 0 ? 0 : items.length - 1) : (at + step + items.length) % items.length;
  items[to].focus();
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { setSettings(false); return; }
  if (e.target.closest && e.target.closest("#setup")) return; // keys inside settings belong to the controls
  if (e.altKey || e.ctrlKey || e.metaKey) return; // browser shortcuts (Alt+← is Back)
  if (e.repeat && (e.key === "ArrowRight" || e.key === "ArrowLeft")) return; // a held key must not race past the finish
  if (e.key === "ArrowRight") { audio(); goNext(); return; }
  if (e.key === "ArrowLeft") { audio(); goBack(); return; }
  if (e.key === "ArrowDown") { e.preventDefault(); moveFocus(1); return; }
  if (e.key === "ArrowUp") { e.preventDefault(); moveFocus(-1); return; }
  if (index >= deck.length) return;
  // 1–3 pick the answer in that place; in Road trip, S = stop and G = go.
  let btn = null;
  if (/^[1-9]$/.test(e.key)) btn = $("choices").querySelectorAll(".choice")[Number(e.key) - 1];
  else if (deck[index].type === "trip" && /^[sg]$/i.test(e.key)) {
    btn = $("choices").querySelector(`.choice[data-value="${e.key.toLowerCase() === "s" ? "stop" : "go"}"]`);
  }
  if (btn) { audio(); choose(btn.dataset.value, btn); }
});
// Swipe left for next question, right for previous
let swipeX = null, swipeY = null;
document.addEventListener("touchstart", e => {
  const t = e.changedTouches[0];
  swipeX = t.clientX; swipeY = t.clientY;
}, { passive: true });
document.addEventListener("touchend", e => {
  if (swipeX === null) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - swipeX, dy = t.clientY - swipeY;
  swipeX = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    audio();
    if (dx < 0) goNext(); else goBack();
  }
}, { passive: true });
$("sayBtn").addEventListener("click", () => { audio(); sayPrompt(); });
$("hintBtn").addEventListener("click", () => { audio(); showHint(); });
$("next").addEventListener("click", () => { audio(); goNext(); });
$("back").addEventListener("click", () => { audio(); goBack(); });
$("settingsBtn").addEventListener("click", () => setSettings(!$("setup").classList.contains("open")));
document.addEventListener("click", e => {
  if (!$("setup").classList.contains("open")) return;
  if ($("setup").contains(e.target) || $("settingsBtn").contains(e.target)) return;
  setSettings(false);
});
document.querySelectorAll(".chip[data-group]").forEach(b => {
  b.addEventListener("click", () => {
    const g = b.dataset.group;
    document.querySelectorAll(`.chip[data-group="${g}"]`).forEach(c => {
      c.setAttribute("aria-pressed", c === b ? "true" : "false");
    });
    if (g === "mode") mode = b.dataset.val;
    if (g === "round") roundSize = Number(b.dataset.val);
    audio();
    newGame();
  });
});
$("voice").addEventListener("change", () => { audio(); sayPrompt(); });

// Leaving the game (🏠 or Back): stop any device speech so it doesn't talk over the hub.
addEventListener("pagehide", stopAudio);
fillVoices();
[300, 1000, 2500].forEach(t => setTimeout(fillVoices, t));
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = fillVoices;
newGame();
</script>
</body>
</html>
